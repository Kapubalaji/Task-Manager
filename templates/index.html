<!DOCTYPE html>

<html>

<head>
    <title>Task Manager</title>

     <style>
    	body {
    		font-family: Arial, sans-serif;
    		background-color: #f1f5f9;
    		margin: 0;
    	}

    	input {
    		padding: 8px;
    		box-sizing: border-box;
    	}

    	button {
    		padding: 8px 12px;
    		margin-left: 5px;
    		cursor: pointer;
    		transition: 0.2s;
    	}
    	.container {
    		width: 100%;
    		min-height: 100vh;
    		padding: 40px;
    		box-sizing: border-box;
            background-color: #cbedf2;
  
    	}
    	button:hover {
    		opacity: 0.8;
    	}

    	h1 {
    		text-align: center;
    	}
    	.task {
    	    padding: 10px;
    	    margin-bottom: 8px;
    	    border: 1px solid #dbe3ec;
    	    background-color: #ffffff;
    	    border-radius: 5px;

    	    display: flex;
    	    align-items: center;
    	    gap: 8px;
    	    transition: 0.2s;
    	    
    	}
    	.task span {
    		flex: 1;
    	}
    	.task.completed span{
    		text-decoration: line-through;
    		opacity: 0.6;
    	}
    	.add-btn {
    	    background-color: #333;
    	    color: white;
    	    border: none;
    	    border-radius: 4px;
    	}
    	.complete-btn {
    	    background-color: #16a34a;
    	    color: white;
    	    border: none;
    	    border-radius: 4px;
    	}
    	.delete-btn {
    	    background-color: #dc2626;
    	    color: white;
    	    border: none;
    	    border-radius: 4px;
    	}
    	input:focus {
    	    outline: 2px solid #333;
    	}
    	.task:hover {
    	    background-color: #f8fafc;
    	}
    	.task-form {
    	    display: flex;
    	    gap: 8px;
    	}
    	
    	.task-form input {
    	    flex: 1;
    	}
    	@media (max-width: 600px) {
    	    .container {
    	        width: 90%;
    	        margin: 20px auto;
    	    }
    	
    	    .task {
    	        flex-wrap: wrap;
    	    }
    	}
    </style>
</head>

<body>

<div class = "container">

    <h1>Task Manager</h1>

<div class="task-form">
    <input
        type="text"
        id="task-input"
        placeholder="Enter a task"
    >

    <button id="add-button" class="add-btn">Add Task</button>
</div>
    <h2>Tasks</h2>

    <div id="task-list">
    </div>

</div>
    <script>

        let taskList = document.getElementById("task-list");

        let addButton = document.getElementById("add-button");
        let taskInput = document.getElementById("task-input");


        // Get tasks from Flask
        //READ
        function loadTasks(){
        fetch("/tasks")
            .then(response => response.json())
            .then(tasks => {

                taskList.innerHTML = "";

                tasks.forEach(task => {
                let taskClass = "task";
                
                if (task.status === "completed") {
                	taskClass = "task completed";
                }
                let taskHTML = 
                    '<div class ="' + taskClass + '">' +
                    '<span>' + task.title + '</span>'; 
                if (task.status === "pending"){
                    taskHTML += '<button class="complete-btn" onclick="completeTask(' + task.id + ')">Complete</button>';
                    }

                    taskHTML +=
                     '<button class="delete-btn" onclick="deleteTask(' + task.id + ')">Delete</button>' +
                     '</div>';

                     taskList.innerHTML += taskHTML;
                });
            });
         }
           
			loadTasks();

        // Detect Add Task button click
        //addButton.addEventListener("click", function() {
          //  let title = taskInput.value;


            //console.log(title);

        //});
        //POST
        //CREATE
        addButton.addEventListener("click", function() {
        	let title = taskInput.value;
        	if (title.trim() === "") {
        	    alert("Please enter a task");
        	    return;
            }
        	fetch("/tasks", {
        		method: "POST",

        		headers: {
        			"content-Type": "application/json"
        		},
        		body: JSON.stringify({
        			title:title,
        			status:"pending"
        		})
        	})
        		.then(response => response.json())
        		.then(data => {
        		    console.log(data);
        		    loadTasks();
        		    taskInput.value = "";
        		    
        		});
        });

        //add task click event

        taskInput.addEventListener("keydown", function(event){
        	if (event.key === "Enter"){
        		addButton.click();
        	}
        })

        //update 
        function completeTask(taskId) {
        	fetch("/tasks/" + taskId, {
        		method: "PUT",
        		headers: {
        			"Content-Type": "application/json"
        		},
        		body: JSON.stringify({
        			status: "completed"
        		})
        	})
        	.then(response => response.json())
        	.then(data => {
        		console.log(data);         

        		loadTasks();             //function calling
        	});
        }
        //DELETE
        function deleteTask(taskId) {
        	let result = confirm("Are you sure you want to delete this task?");

        	if(result === false) {
        		return;
        	}
        
            fetch("/tasks/" + taskId, {
                method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {
        
                console.log(data);
        
                loadTasks();
        
            });
        }
    </script>

</body>

</html>
